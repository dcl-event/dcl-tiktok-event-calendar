<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>20万超KPI 逆算ボード</title>
<style>
:root{
  --bg:#f3f5f6; --card:#fff; --fg:#0f1515; --muted:#6a7472; --line:#e3e8e7;
  --accent:#1f6feb; --over:#1f6feb; --under:#cdd5d4;
  --ok:#17824c; --okbg:#e7f5ed; --warn:#9a6400; --warnbg:#fdf3e0;
  --bad:#c0392b; --badbg:#fdecea; --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1515; --card:#14201f; --fg:#e4ecea; --muted:#8c9a97; --line:#22302e;
  --accent:#6ea8ff; --over:#6ea8ff; --under:#36443f;
  --ok:#4cc38a; --okbg:#10291e; --warn:#e2a93b; --warnbg:#2a2111;
  --bad:#f06a5d; --badbg:#2c1715; --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 90px}
.brand{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.14em;
  font-weight:600;margin:0 0 22px}
h1{font-size:26px;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 3px;letter-spacing:-.005em}
.sec{margin-top:34px}
.meta{color:var(--muted);font-size:12.5px;margin:0 0 4px}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;
  font-weight:700;vertical-align:2px}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px;margin:14px 0}
.tile{position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile .k{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .n{font-size:12.5px;color:var(--muted);margin-top:1px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:13px 0 8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.tile .r{font-size:13px;font-weight:650;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;
  font-family:inherit;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(315px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  box-shadow:var(--shadow)}
.p h3{font-size:15px;margin:0;font-weight:700;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .sub{color:var(--muted);font-size:12px;margin:2px 0 11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .land{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.p .land small{font-size:12.5px;font-weight:500;color:var(--muted)}
.p .nums{font-size:12px;color:var(--muted);margin-top:2px}
.p .stats{display:flex;gap:14px;font-size:12px;color:var(--muted);
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.p .stats b{color:var(--fg);font-weight:650}
.links{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.links a{font-size:11.5px;text-decoration:none;border:1px solid var(--line);
  color:var(--muted);border-radius:7px;padding:4px 9px;font-weight:600}
.links a:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.note{border-radius:12px;padding:14px 17px;margin-top:14px;font-size:13.5px;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent)}
.note.bad{border-left-color:var(--bad)} .note.warn{border-left-color:var(--warn)}
svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:9px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details{margin-top:28px;font-size:13px}
summary{cursor:pointer;color:var(--muted);padding:9px 0;font-weight:600}
details li{margin:7px 0;color:var(--muted)}
.btn{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;text-decoration:none;font-size:13.5px;color:var(--fg);font-weight:600;
  box-shadow:var(--shadow)}
#gate{max-width:520px;margin:20vh auto;padding:0 20px;text-align:center;color:var(--muted)}
#gate b{color:var(--fg);display:block;font-size:17px;margin-bottom:10px}
.foot{margin-top:42px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px}
@media(max-width:560px){h1{font-size:21px}.tile .v{font-size:26px}.wrap{padding-top:16px}}
</style>
</head>
<body>
<div id="gate" hidden><b>この画面は鍵がないと開けません</b>
URLの「#」より後ろまで含めて開いてください。途中で切れていると中身は出ません。</div>
<div class="wrap" id="app" hidden></div>
<script>
var N=function(x){return Math.round(x).toLocaleString('ja-JP')};
var N1=function(x){return (Math.round(x*10)/10).toLocaleString('ja-JP')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var cls=function(r){return r>=100?'ok':(r>=90?'warn':'bad')};
var D=null;

function tiles(){
  var rows=[['全体💎','total','💎','事業全体の獲得ダイヤ'],
            ['20万超💎','over20','💎','20万ダイヤ以上の層が出すぶん'],
            ['20万超の人数','count','人','単価'+N(D.tanka)+'で割った目安']];
  return '<div class="grid3">'+rows.map(function(r){
    var x=D.now[r[1]], c=cls(x.rate), u=r[2], cnt=(r[1]==='count');
    return '<div class="card tile" style="--c:var(--'+c+')">'+
      '<div class="k">'+r[0]+'</div>'+
      '<div class="v">'+(cnt?N1(x.proj):N(x.proj))+'<small>'+u+'</small></div>'+
      '<div class="n">必要 '+(cnt?N1(x.need):N(x.need))+u+' ・ '+esc(r[3])+'</div>'+
      '<div class="bar"><i style="width:'+Math.min(x.rate,100)+'%"></i></div>'+
      '<div class="r">'+x.rate+'%　'+(x.gap>0?'あと '+(cnt?N1(x.gap):N(x.gap))+u:'必要な数に届いています')+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

function person(p){
  var pct=Math.min(100,Math.round(p.land/200000*100));
  var c=p.isOver?'ok':(pct>=70?'warn':'bad');
  var tag=p.quit?'<span class="pill bad">退会</span>'
        :(p.isOver?'<span class="pill ok">20万超</span>'
        :'<span class="pill warn">あと'+N(p.gap)+'</span>');
  var rt=p.ratio==null?'<small>先月なし</small>'
        :'<small>先月比 </small><span class="pill '+cls(p.ratio)+'">'+p.ratio+'%</span>';
  var L=[];
  if(p.user) L.push('<a href="https://www.tiktok.com/@'+encodeURIComponent(p.user)+'" target="_blank" rel="noopener">TikTok</a>');
  if(p.bs)   L.push('<a href="'+esc(p.bs)+'" target="_blank" rel="noopener">Backstage</a>');
  if(p.liny) L.push('<a href="'+esc(p.liny)+'" target="_blank" rel="noopener">Liny</a>');
  return '<div class="p" data-over="'+(p.isOver?1:0)+'" data-was="'+(p.wasOver?1:0)+
         '" data-down="'+((p.ratio!=null&&p.ratio<100)?1:0)+'" data-near="'+((!p.isOver&&pct>=60)?1:0)+'">'+
    '<h3>'+esc(p.name)+' '+tag+'</h3>'+
    '<div class="sub">'+(p.user?'@'+esc(p.user)+' ・ ':'')+esc(p.mgr||'担当なし')+
      (p.rank?' ・ '+esc(p.rank):'')+(p.event?' ・ '+esc(p.event):'')+'</div>'+
    '<div class="land">'+N(p.land)+'<small> 💎 着地見込み</small></div>'+
    '<div class="nums">今月 '+N(p.mtd)+' ／ 先月 '+N(p.prev)+'　'+rt+'</div>'+
    '<div class="bar" style="--c:var(--'+c+')"><i style="width:'+pct+'%"></i></div>'+
    '<div class="stats"><span>配信 <b>'+N1(p.hours)+'h</b> / <b>'+p.ldays+'日</b></span>'+
      '<span>平均同接 <b>'+N1(p.ccv)+'</b></span></div>'+
    '<div class="links">'+L.join('')+'</div></div>';
}

/* 積み上げ棒 */
function stacked(series,aName,bName){
  var W=980,H=250,P=26,step=(W-P*2)/series.length,BW=Math.min(60,step-18);
  var mx=Math.max.apply(null,series.map(function(s){return s.a+s.b}))*1.2,s='';
  series.forEach(function(d,i){
    var x=P+step*i+(step-BW)/2, hb=(d.b/mx)*(H-56), ha=(d.a/mx)*(H-56);
    var yb=H-30-hb, ya=yb-ha;
    s+='<g><rect x="'+x+'" y="'+yb+'" width="'+BW+'" height="'+hb+'" fill="var(--over)" rx="3"/>'+
       '<rect x="'+x+'" y="'+ya+'" width="'+BW+'" height="'+ha+'" fill="var(--under)" rx="3"/>'+
       '<text x="'+(x+BW/2)+'" y="'+(ya-9)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">'+esc(d.top)+'</text>'+
       '<text x="'+(x+BW/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+esc(d.label)+'</text>'+
       '<title>'+esc(d.label)+'  合計 '+N(d.a+d.b)+'\n'+esc(bName)+' '+N(d.b)+'\n'+esc(aName)+' '+N(d.a)+'</title></g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>'+
    '<div class="lg"><span><i style="background:var(--over)"></i>'+esc(bName)+'</span>'+
    '<span><i style="background:var(--under)"></i>'+esc(aName)+'</span></div>';
}

/* 横棒（前月比） */
function bars(list){
  var W=980,RH=24,P=170,H=list.length*RH+28;
  var mx=Math.max(120,Math.max.apply(null,list.map(function(d){return d.ratio})))*1.04;
  var sc=function(v){return (v/mx)*(W-P-62)}, x100=P+sc(100);
  var s='<line x1="'+x100+'" y1="2" x2="'+x100+'" y2="'+(H-22)+'" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>'+
        '<text x="'+x100+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="var(--muted)">100%</text>';
  list.forEach(function(d,i){
    var y=i*RH+3, w=Math.max(sc(d.ratio),2);
    var col=d.ratio>=100?'var(--ok)':(d.ratio>=60?'var(--warn)':'var(--bad)');
    var nm=d.name.length>14?d.name.slice(0,14)+'…':d.name;
    s+='<g><text x="'+(P-10)+'" y="'+(y+14)+'" text-anchor="end" font-size="12.5" fill="currentColor">'+esc(nm)+'</text>'+
       '<rect x="'+P+'" y="'+(y+3)+'" width="'+w+'" height="'+(RH-10)+'" fill="'+col+'" rx="3"/>'+
       '<text x="'+(P+w+8)+'" y="'+(y+14)+'" font-size="11.5" fill="var(--muted)">'+d.ratio+'%'+(d.note?'　'+esc(d.note):'')+'</text>'+
       '<title>'+esc(d.name)+'\n先月 '+N(d.prev)+' → 着地見込み '+N(d.land)+'（'+d.ratio+'%）</title></g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}

/* 日次ボードとの突き合わせ */
function recon(){
  var R=D.recon; if(!R) return '';
  var row=function(x,me){return '<tr'+(me?' style="font-weight:700"':'')+'><td>'+esc(x.label)+'</td>'+
    '<td>'+x.n+'人</td><td>'+N(x.prev)+'</td><td>'+N(x.land)+'</td>'+
    '<td><span class="pill '+cls(x.ratio)+'">'+x.ratio+'%</span></td></tr>'};
  var g=R.gone.map(function(p){return esc(p.name)+'（先月 '+N(p.prev)+' → 今月 '+N(p.mtd)+'で停止）'}).join('、');
  return '<details style="margin-top:14px"><summary>日次ボードと数字が違う理由</summary>'+
    '<div class="card" style="margin-top:8px"><table><thead><tr><th>出し方</th><th>人数</th>'+
    '<th>先月実績</th><th>着地見込み</th><th>前月比</th></tr></thead><tbody>'+
    row(R.all,true)+row(R.stay)+row(R.raw)+'</tbody></table></div>'+
    '<ul><li><b>どちらも計算は合っている。違うのは2点だけ。</b></li>'+
    '<li><b>①退会した人を数に入れるか。</b>このボードは入れる（先月のダイヤは実際に出たものなので、'+
      'いなくなったぶんは素直に穴として見せたい）。日次ボードは外す。'+
      (g?'今回ちょうど1人ぶんで、'+g+'。':'')+'</li>'+
    '<li><b>②月末まで伸ばすときに補正をかけるか。</b>このボードは過去の実測から'+D.factors.cohort+
      '倍かける。日次ボードは日割り×30のまま。'+
      (R.band?'補正の幅（'+D.factors.used.map(function(f){return f.cohort}).join('・')+
      '倍）をそのまま効かせると<b>'+R.band[0]+'% 〜 '+R.band[1]+'%</b>の間に入る＝この数字はかなり揺れる。':'')+'</li>'+
    '<li>日次ボードの「実績（11日分）」は、このボードの在籍16人の今月MTD合計と1円まで一致する＝元データは同じ。</li>'+
    '</ul></details>';
}

function start(data){
  D=data;
  var c=D.cohort_sum, L=D.ladder, last=L[L.length-1], h=D.history;
  var avg=Math.round(h.reduce(function(a,x){return a+x.share},0)/h.length*10)/10;
  var r3=h.slice(-3), ra=Math.round(r3.reduce(function(a,x){return a+x.share},0)/r3.length*10)/10;
  var ov=D.now.over20, pc=D.now.count, o='';

  o+='<div class="brand">DeNA Creator Links</div>'+
     '<h1>20万超KPI 逆算ボード</h1>'+
     '<p class="meta">'+esc(D.month)+'　'+esc(D.asof)+'　/　更新 '+esc(D.updated)+
     '　/　ハイタッチ確認シート '+esc(D.tab)+' タブ</p>';

  o+='<div class="sec"><h2>今月はどうなりそうか</h2>'+
     '<p class="lede">着地の見込みと、全体計画から逆算した「必要な数」。</p>'+tiles()+
     '<div class="note'+(ov.rate<100?' bad':'')+'">'+
     (ov.rate>=100&&pc.rate<100
       ? '<b>ダイヤは届くが、人数が足りない。</b>一人あたりが大きい人で届いていて、層の厚みでは届いていない。'
       : (ov.rate>=100 ? '<b>ダイヤも人数も必要な数に届いている。</b>'
          : '<b>20万超が未達。</b>ダイヤが<b>あと'+N(ov.gap)+'💎</b>、人数が<b>あと'+N1(pc.gap)+
            '人</b>足りない。全体が'+D.now.total.rate+'%なのは20万未満の層が伸びているからで、この層だけ見ると届いていない。'))+
     '</div></div>';

  o+='<div class="sec"><h2>ライバー別</h2>'+
     '<p class="lede">20万のまわりにいる'+D.people.length+'人。着地見込みの多い順。バーは20万ダイヤまでの距離。</p>'+
     '<div class="chips">'+
       '<button class="chip" data-f="all" aria-pressed="true">全員 '+D.people.length+'</button>'+
       '<button class="chip" data-f="over" aria-pressed="false">今月20万超えそう '+D.people.filter(function(p){return p.isOver}).length+'</button>'+
       '<button class="chip" data-f="down" aria-pressed="false">先月より落ちている '+D.people.filter(function(p){return p.ratio!=null&&p.ratio<100}).length+'</button>'+
       '<button class="chip" data-f="near" aria-pressed="false">あと一歩 '+D.people.filter(function(p){return !p.isOver&&p.land/200000>=0.6}).length+'</button>'+
     '</div><div class="people" id="people">'+D.people.map(person).join('')+'</div></div>';

  o+='<div class="sec"><h2>先月20万を超えた'+c.n+'人のいま</h2>'+
     '<p class="lede">着地見込み ÷ 先月の実績。点線より左が、先月より落ちている人。</p>'+
     '<div class="card">'+bars(D.cohort)+'</div>'+
     '<div class="note'+(c.ratio<100?' bad':'')+'"><b>この'+c.n+'人だけ追うと、今月は先月の'+c.ratio+'%</b>'+
     '（'+N(c.prev)+' → '+N(c.land)+'）。'+c.under100+'人が100%割れで、今月も20万を超えそうなのは'+c.keep+'人。'+
     (D.recon?'退会した人を除いて<b>いま在籍している'+D.recon.stay.n+'人だけ</b>なら<b>'+D.recon.stay.ratio+'%</b>。':'')+
     (c.ratio<100?'新しく上がってくる人が乗っても20万超の合計は'+ov.rate+'%止まり＝<b>「出す」も「残す」も足りていない。</b>':'')+
     '</div>'+
     recon()+
     '<p style="margin-top:14px"><a class="btn" href="'+esc(D.daily_board)+'" target="_blank" rel="noopener">日次ボードを開く →</a></p></div>';

  o+='<div class="sec"><h2>全体のどれだけをこの層が作っているか</h2>'+
     '<p class="lede">'+esc(h[0].m)+'〜'+esc(h[h.length-1].m)+'は'+
     Math.min.apply(null,h.map(function(x){return x.share}))+'% 〜 '+
     Math.max.apply(null,h.map(function(x){return x.share}))+'%、平均<b>'+avg+'%</b>。'+
     '年の前半は'+h[0].share+'%で、直近3か月は'+r3.map(function(x){return x.share+'%'}).join('・')+
     '（平均<b>'+ra+'%</b>）＝<b>割合そのものが上がってきている</b>。</p>'+
     '<div class="card">'+stacked(h.map(function(x){return {label:x.m,a:x.under20,b:x.over20,top:x.share+'%'}}),
       '20万未満💎','20万超💎')+'</div>';
  o+='<div class="card" style="margin-top:12px"><table><thead><tr><th>月</th><th>全体💎</th>'+
     '<th>20万超💎</th><th>占有率</th><th>人数</th><th>一人あたり</th></tr></thead><tbody>'+
     h.map(function(x){return '<tr><td>'+esc(x.m)+'</td><td>'+N(x.total)+'</td><td>'+N(x.over20)+
       '</td><td>'+x.share+'%</td><td>'+x.n20+'人</td><td>'+N(x.tanka)+'</td></tr>'}).join('')+
     '</tbody></table></div>';
  var pk=h.reduce(function(a,x){return x.tanka>a.tanka?x:a},h[0]), lt=h[h.length-1];
  if(lt.tanka<pk.tanka)
    o+='<div class="note warn">一人あたりは'+esc(pk.m)+'の'+N(pk.tanka)+'がいちばん高く、'+esc(lt.m)+'は'+
       N(lt.tanka)+'（−'+Math.round((1-lt.tanka/pk.tanka)*100)+'%）。<b>層は厚くなっているが、一人の大きさは小さくなっている。</b>'+
       'だから同じダイヤを出すのに必要な人数はこれから増える。</div>';
  o+='</div>';

  o+='<div class="sec"><h2>毎月いくら出せばいいか</h2>'+
     '<p class="lede">全体計画から「20万未満の層が出すぶん」を引いた残り。20万未満は直近3か月で月およそ +'+
     N(D.under_delta)+'💎 伸びているので、そのペースが続く前提。</p>'+
     '<div class="card">'+stacked(L.map(function(x){return {label:x.m,a:x.under,b:x.need,top:N1(x.people)+'人'}}),
       '20万未満の見込み💎','必要な20万超💎')+'</div>';
  o+='<div class="card" style="margin-top:12px"><table><thead><tr><th>月</th><th>全体計画💎</th>'+

     L.map(function(x){return '<tr'+(x.m===D.month?' style="font-weight:700"':'')+'><td>'+esc(x.m)+'</td><td>'+

       N1(x.people)+'人</td></tr>'}).join('')+'</tbody></table></div>';
  o+='<div class="note"><b>必要な占有率はどの月も7割前後</b>で、直近3か月の実績（'+ra+'%）の範囲内＝比率は無理をしなくていい。'+
     'きついのは人数で、<b>'+N1(L[0].people)+'人 → '+esc(last.m)+'に'+N1(last.people)+'人</b>。'+
     '単価'+N(D.tanka)+'で割った目安なので、単価が下がればさらに増える。</div></div>';

  o+='<details><summary>数え方と注意点</summary><ul>'+
     '<li>確定値は「先月のダイヤモンド数」の列だけを使う。「ダイヤモンド」の列は月の途中の値なので確定値には使わない</li>'+

     '<li><b>先月比だけは別の倍率（'+D.factors.cohort+'倍）。</b>全体の倍率は「新しく上がってきた人」込みなので、'+

       D.factors.used.map(function(f){return esc(f.m)+' '+f.cohort}).join(' / ')+'）を使っている</li>'+
