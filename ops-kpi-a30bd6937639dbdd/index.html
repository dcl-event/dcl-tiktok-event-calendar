<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>20万超KPI 逆算ボード</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --fg:#1d1b17; --muted:#6b675f; --line:#e6e3dd;
  --over:#2d6fe0; --under:#c9c5bd; --ok:#1a8a52; --warn:#b07400; --bad:#c0392b;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17171a; --panel:#1f1f23; --fg:#ece9e4; --muted:#9a958c; --line:#32323a;
  --over:#6fa3ff; --under:#4a4a53; --ok:#4cc38a; --warn:#e2a93b; --bad:#f06a5d;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.01em}
h2{font-size:16px;margin:40px 0 4px;padding-top:20px;border-top:1px solid var(--line)}
h2:first-of-type{border-top:0;padding-top:0}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card .k{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.card .v{font-size:27px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.card .n{font-size:12.5px;color:var(--muted);margin-top:2px}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 7px}
.meter i{display:block;height:100%;border-radius:3px}
.gap{font-size:13px;font-weight:600}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:14px 0}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12.5px}
tbody tr:hover{background:var(--panel)}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--over);
  border-radius:8px;padding:13px 16px;margin:18px 0;font-size:13.5px}
.note.red{border-left-color:var(--bad)}
.note.amber{border-left-color:var(--warn)}
svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details{margin-top:26px;font-size:13.5px}
summary{cursor:pointer;color:var(--muted);padding:8px 0}
details li{margin:7px 0;color:var(--muted)}
a{color:var(--over)}
.btn{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:10px 15px;text-decoration:none;font-size:13.5px;margin:6px 0}
#gate{max-width:520px;margin:18vh auto;padding:0 20px;text-align:center;color:var(--muted)}
#gate b{color:var(--fg);display:block;font-size:17px;margin-bottom:10px}
.foot{margin-top:46px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div id="gate" hidden><b>この画面は鍵がないと開けません</b>
URLの「#」より後ろまで含めて開いてください。途中で切れていると中身は出ません。</div>
<div class="wrap" id="app" hidden></div>
<script>
var N=function(x){return Math.round(x).toLocaleString('ja-JP')};
var N1=function(x){return (Math.round(x*10)/10).toLocaleString('ja-JP')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var cls=function(r){return r>=100?'ok':(r>=90?'warn':'bad')};
var cvar=function(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()};

function cards(D){
  var rows=[['全体💎','total','💎','事業全体の獲得ダイヤ'],
            ['20万超💎','over20','💎','20万ダイヤ以上の層が出すぶん'],
            ['20万超の人数','count','人','単価'+N(D.tanka)+'で割った目安']];
  return '<div class="cards">'+rows.map(function(r){
    var x=D.now[r[1]], c=cls(x.rate), u=r[2];
    var v=(r[1]==='count')?N1(x.proj):N(x.proj);
    var need=(r[1]==='count')?N1(x.need):N(x.need);
    var gap=x.gap>0 ? 'あと '+((r[1]==='count')?N1(x.gap):N(x.gap))+u
                    : '必要な数に届いています';
    return '<div class="card"><div class="k">'+r[0]+'</div>'+
      '<div class="v">'+v+'<span style="font-size:15px;font-weight:400"> '+u+'</span></div>'+
      '<div class="n">必要 '+need+u+'　/　'+esc(r[3])+'</div>'+
      '<div class="meter"><i style="width:'+Math.min(x.rate,100)+'%;background:var(--'+c+')"></i></div>'+
      '<div class="gap '+c+'">'+x.rate+'%　'+gap+'</div></div>';
  }).join('')+'</div>';
}

/* 積み上げ棒。series=[{label, a, b, top}] a=下(薄) b=上(濃) */
function stacked(series,aName,bName){
  var W=860,H=260,P=34,BW=Math.min(66,(W-P*2)/series.length-16);
  var mx=Math.max.apply(null,series.map(function(s){return s.a+s.b}))*1.18;
  var step=(W-P*2)/series.length, s='';
  series.forEach(function(d,i){
    var x=P+step*i+(step-BW)/2, tot=d.a+d.b;
    var hb=(d.b/mx)*(H-56), ha=(d.a/mx)*(H-56);
    var yb=H-30-hb, ya=yb-ha;
    s+='<rect x="'+x+'" y="'+yb+'" width="'+BW+'" height="'+hb+'" fill="var(--over)" rx="2"/>';
    s+='<rect x="'+x+'" y="'+ya+'" width="'+BW+'" height="'+ha+'" fill="var(--under)" rx="2"/>';
    s+='<text x="'+(x+BW/2)+'" y="'+(ya-8)+'" text-anchor="middle" font-size="12" font-weight="650" fill="var(--fg)">'+esc(d.top)+'</text>';
    s+='<text x="'+(x+BW/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+esc(d.label)+'</text>';
    s+='<title>'+esc(d.label)+'  合計 '+N(tot)+'\n'+esc(bName)+' '+N(d.b)+'\n'+esc(aName)+' '+N(d.a)+'</title>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+s+'</svg>'+
    '<div class="lg"><span><i style="background:var(--over)"></i>'+esc(bName)+'</span>'+
    '<span><i style="background:var(--under)"></i>'+esc(aName)+'</span></div>';
}

/* 横棒（前月比）。100%に基準線 */
function bars(list){
  var W=860,RH=22,P=150,H=list.length*RH+30;
  var mx=Math.max(120,Math.max.apply(null,list.map(function(d){return d.ratio})))*1.04;
  var sc=function(v){return (v/mx)*(W-P-56)};
  var s='<line x1="'+(P+sc(100))+'" y1="4" x2="'+(P+sc(100))+'" y2="'+(H-22)+
        '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>'+
        '<text x="'+(P+sc(100))+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">100%</text>';
  list.forEach(function(d,i){
    var y=i*RH+4, w=Math.max(sc(d.ratio),1);
    var col=d.ratio>=100?'var(--ok)':(d.ratio>=60?'var(--warn)':'var(--bad)');
    var nm=d.name.length>13?d.name.slice(0,13)+'…':d.name;
    s+='<text x="'+(P-9)+'" y="'+(y+13)+'" text-anchor="end" font-size="12" fill="var(--fg)">'+esc(nm)+'</text>';
    s+='<rect x="'+P+'" y="'+(y+3)+'" width="'+w+'" height="'+(RH-9)+'" fill="'+col+'" rx="2"/>';
    s+='<text x="'+(P+w+7)+'" y="'+(y+13)+'" font-size="11.5" fill="var(--muted)">'+d.ratio+'%'+
       (d.note?'　'+esc(d.note):'')+'</text>';
    s+='<title>'+esc(d.name)+'\n先月 '+N(d.prev)+' → 今月の着地見込み '+N(d.land)+'（'+d.ratio+'%）</title>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+s+'</svg>';
}

function start(D){
  var c=D.cohort_sum, L=D.ladder, last=L[L.length-1], h=D.history;
  var avg=Math.round(h.reduce(function(a,x){return a+x.share},0)/h.length*10)/10;
  var o='';

  o+='<h1>20万超KPI 逆算ボード</h1>'+
     '<p class="sub">'+esc(D.month)+'　'+esc(D.asof)+'　/　更新 '+esc(D.updated)+
     '　/　元データ = ハイタッチ確認シート '+esc(D.tab)+' タブ</p>';

  o+='<h2>今月はどうなりそうか</h2>'+
     '<p class="lede">着地の見込みと、全体計画から逆算した「必要な数」を並べたもの。</p>'+cards(D);

  var t=D.now.total,v=D.now.over20,p=D.now.count;
  o+='<div class="note'+(p.rate<100?' amber':'')+'">'+
     (v.rate>=100&&p.rate<100
       ? '<b>ダイヤは届くが、人数が足りない。</b>いま届いているのは一人あたりが大きい人がいるからで、層の厚みで届いているわけではない。'
       : (v.rate>=100 ? '<b>ダイヤも人数も必要な数に届いている。</b>'
                      : '<b>20万超のダイヤが必要な数に届いていない。</b>ここが全体の7割を作る層なので、ここが欠けると全体も欠ける。'))+
     '</div>';

  o+='<h2>先月20万を超えた'+c.n+'人は、いまどうなっているか</h2>'+
     '<p class="lede">今月の着地見込み ÷ 先月の実績。点線より左が、先月より落ちている人。</p>'+
     bars(D.cohort);
  o+='<div class="note'+(c.ratio<100?' red':'')+'">'+
     '<b>この'+c.n+'人だけを追うと、今月の合計は先月の'+c.ratio+'%</b>'+
     '（'+N(c.prev)+' → '+N(c.land)+'）。'+c.under100+'人が100%を割っていて、'+
     '今月も20万を超えそうなのは'+c.keep+'人。'+
     (c.ratio<100 ? 'それでも20万超の合計が必要な数に近いのは、新しく上がってきた人が乗っているから。'+
                    '<b>いまの達成は「出す」で作っていて、「残す」では作れていない。</b>' : '')+
     '</div>';
  o+='<a class="btn" href="'+esc(D.daily_board)+'" target="_blank" rel="noopener">'+
     '→ どのライバーさんかは日次ボードで見る</a>';

  var r3=h.slice(-3), ra=Math.round(r3.reduce(function(a,x){return a+x.share},0)/r3.length*10)/10;
  o+='<h2>全体のどれだけを、この層が作っているか</h2>'+
     '<p class="lede">'+esc(h[0].m)+'から'+esc(h[h.length-1].m)+'まで、20万超の層が占める割合は'+
     Math.min.apply(null,h.map(function(x){return x.share}))+'% 〜 '+
     Math.max.apply(null,h.map(function(x){return x.share}))+'%。'+esc(h.length)+'か月の平均は<b>'+avg+'%</b>だが、'+
     '年の前半は'+h[0].share+'%で、直近3か月は'+r3.map(function(x){return x.share+'%'}).join('・')+
     '（平均<b>'+ra+'%</b>）。<b>割合そのものが上がってきている</b>ので、平均より直近で見るほうが実態に近い。</p>'+
     stacked(h.map(function(x){return {label:x.m,a:x.under20,b:x.over20,top:x.share+'%'}}),
             '20万未満💎','20万超💎');
  o+='<table><thead><tr><th>月</th><th>全体💎</th><th>20万超💎</th><th>占有率</th>'+
     '<th>人数</th><th>一人あたり</th></tr></thead><tbody>'+
     h.map(function(x){return '<tr><td>'+esc(x.m)+'</td><td>'+N(x.total)+'</td><td>'+N(x.over20)+
       '</td><td>'+x.share+'%</td><td>'+x.n20+'人</td><td>'+N(x.tanka)+'</td></tr>'}).join('')+
     '</tbody></table>';
  var pk=h.reduce(function(a,x){return x.tanka>a.tanka?x:a},h[0]), lt=h[h.length-1];
  var down=lt.tanka<pk.tanka;
  o+='<div class="note">一人あたりは'+esc(pk.m)+'の'+N(pk.tanka)+'がいちばん高く、'+
     esc(lt.m)+'は'+N(lt.tanka)+(down?'まで下がっている（-'+Math.round((1-lt.tanka/pk.tanka)*100)+'%）':'')+'。'+
     (down?'<b>層は厚くなっているが、一人の大きさは小さくなっている。</b>'+
           'だから同じダイヤを出すのに必要な人数はこれから増える。'
         :'人数の目安はこの一人あたりで割って出している。')+'</div>';

  o+='<h2>毎月いくら出せばいいか</h2>'+
     '<p class="lede">全体計画から「20万未満の層が出すぶん」を引いた残りが、20万超の層に必要なダイヤ。'+
     '20万未満の層は直近3か月で毎月およそ +'+N(D.under_delta)+'💎 で伸びているので、そのペースが続く前提で引いている。</p>'+
     stacked(L.map(function(x){return {label:x.m,a:x.under,b:x.need,top:N1(x.people)+'人'}}),
             '20万未満の見込み💎','必要な20万超💎');
  o+='<table><thead><tr><th>月</th><th>全体計画💎</th><th>20万未満の見込み💎</th>'+
     '<th>必要な20万超💎</th><th>必要な占有率</th><th>必要な人数</th></tr></thead><tbody>'+
     L.map(function(x){return '<tr'+(x.m===D.month?' style="font-weight:650"':'')+'><td>'+esc(x.m)+
       '</td><td>'+N(x.plan)+'</td><td>'+N(x.under)+'</td><td>'+N(x.need)+'</td><td>'+x.share+
       '%</td><td>'+N1(x.people)+'人</td></tr>'}).join('')+'</tbody></table>';
  o+='<div class="note"><b>必要な占有率はどの月も7割前後</b>で、直近3か月の実績（平均'+ra+
     '%）の範囲内。つまり比率は無理をしなくていい。きついのは人数のほうで、'+
     '<b>'+N1(L[0].people)+'人 → '+esc(last.m)+'に'+N1(last.people)+'人</b>。'+
     '必要人数は単価'+N(D.tanka)+'で割った目安なので、単価が下がればさらに増える。</div>';

  o+='<details><summary>数え方と注意点</summary><ul>'+
     '<li>確定値は「先月のダイヤモンド数」の列だけを使っている。「ダイヤモンド」の列は月の途中の値なので確定値には使わない</li>'+
     '<li>シートは2日遅れ。'+esc(D.tab)+'のタブに入っているのは'+esc(D.asof)+'</li>'+
     '<li>今月の見込みは、'+D.days+'日ぶんを月末まで伸ばしたもの。伸ばす倍率は過去の「同じ日づけ」で実際に測った値の平均（'+
       D.factors.used.map(function(f){return esc(f.m)+' '+f.total}).join(' / ')+' → 全体 '+D.factors.total+
       '倍、20万超💎 '+D.factors.over20+'倍、人数 '+D.factors.n20+'倍）</li>'+
     '<li><b>先月比だけは別の倍率（'+D.factors.cohort+'倍）を使っている。</b>'+
       '全体の倍率は「新しく上がってきた人」も込みの束の倍率なので、'+
       '“先月20万超だった人”という決まった束にそのまま掛けると実態より大きく出る。'+
       '過去の月で同じ束の伸び方を測り直した倍率を使っている（'+
       D.factors.used.map(function(f){return esc(f.m)+' '+f.cohort}).join(' / ')+'）</li>'+
     '<li>人の名寄せはクリエイターID。IDが空になる退会者だけユーザー名で拾う</li>'+
     '<li>全体計画の正本は「00.事業戦略 / 計画」。そちらが動いたら monthly_kpi.py の PLAN を直す</li>'+
     '<li>必要人数は直近の確定月の単価（'+N(D.tanka)+'）で割った目安。単価は下がり続けているので増える側に振れる</li>'+
     '</ul></details>';

  o+='<p class="foot">このページは暗号化してあります。URLの「#」以降が鍵なので、'+
     '人に渡すときは必ず最後まで含めて渡してください。社外には出さないこと。</p>';

  var app=document.getElementById('app');
  app.innerHTML=o; app.hidden=false;
}
