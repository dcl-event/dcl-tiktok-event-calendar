<head>

<div class="wrap">
  <header>
    <h1>TikTok LIVE 公式イベントカレンダー</h1>

  </header>

  <div class="controls" id="controls"></div>
  <div class="chart" id="chart" role="listbox" aria-label="イベントスケジュール"></div>

  <footer>
    <div>データの扱い</div>
    <ul>
      <li>原文のダイヤ表記が「💎160以上」「💎0-20万」と混在しているため、万単位に統一して表記しています。</li>
      <li>LIVE Ranking+ ハロウィンパーティーは「8月末までリリース予定」＝内容確定前です。</li>
      <li>PK Battle Royal は原文に参加条件の記載がありません。</li>
      <li>Lark側は数時間で更新されることがあるため、この表はスナップショットです。判断は必ず原文を確認してください。</li>
    </ul>
  </footer>
</div>
