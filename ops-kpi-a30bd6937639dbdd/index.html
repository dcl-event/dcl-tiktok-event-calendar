<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>20万超KPI 逆算ボード</title>
<style>
:root{
  --bg:#faf7f3; --panel:#fff; --sunk:#f4efe8;
  --fg:#2d231c; --fg2:#574639; --muted:#8a7868; --faint:#ab9a8a;
  --line:#ece4da; --line2:#f6f1ea;
  --brand:#7a5640; --accent:#3f87ad;
  --over:#8b6243; --under:#c3dfee;
  --ok:#3a7fa3; --okbg:#eaf4f9; --okline:#c3dded;
  --warn:#9c6b2f; --warnbg:#faf1e3; --warnline:#ebd8ba;
  --bad:#a3503f; --badbg:#f9ebe7; --badline:#eccec5;
  --sh1:0 1px 1px rgba(60,42,28,.04), 0 2px 8px rgba(60,42,28,.05);
  --sh2:0 2px 4px rgba(60,42,28,.06), 0 12px 28px rgba(60,42,28,.09);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191411; --panel:#211a16; --sunk:#1c1512;
  --fg:#f0e7dd; --fg2:#cdbfb2; --muted:#9b8a7a; --faint:#7b6c5e;
  --line:#352b23; --line2:#241d18;
  --brand:#d0a582; --accent:#8fc7e4;
  --over:#c08f66; --under:#3a5565;
  --ok:#7cc0e0; --okbg:#122831; --okline:#1e4253;
  --warn:#dba55e; --warnbg:#2c2314; --warnline:#4a3a1c;
  --bad:#e4897a; --badbg:#2f1d19; --badline:#4e2c25;
  --sh1:none; --sh2:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---- 骨格 ---- */
.shell{display:grid;grid-template-columns:254px minmax(0,1fr);gap:46px;
  max-width:1480px;margin:0 auto;padding:0 32px}
.side{position:sticky;top:0;align-self:start;max-height:100dvh;overflow-y:auto;
  padding:26px 0 34px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
main{padding:30px 0 130px;min-width:0}

.logo{font-size:12px;font-weight:800;letter-spacing:.11em;color:var(--brand);line-height:1.5}
.logo span{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.06em;
  font-weight:700;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650;
  color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:9px;transition:.15s}
.nav a b{font-size:10.5px;color:var(--faint);font-weight:800;min-width:15px}
.nav a:hover{color:var(--fg);background:var(--line2)}
.nav a.on{color:var(--brand);background:var(--line2)}
.nav a.on b{color:var(--brand)}

.scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;box-shadow:var(--sh1)}
.scard h4{margin:0 0 9px;font-size:11px;font-weight:800;letter-spacing:.07em;
  color:var(--faint);text-transform:uppercase}
.pace .big{font-size:22px;font-weight:800;line-height:1.3}
.pace .big small{font-size:11.5px;font-weight:600;color:var(--faint)}
.pace .row{display:flex;justify-content:space-between;font-size:11.5px;
  color:var(--muted);margin-top:3px}
.pace .row b{color:var(--fg2);font-weight:700}
.mini{display:flex;flex-direction:column;gap:7px}
.mini a{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;
  font-size:12px;border-radius:8px;padding:2px 3px;transition:.15s}
.mini a:hover{background:var(--line2)}
.mini .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--fg2);font-weight:650}
.sfoot{font-size:11px;color:var(--faint);line-height:1.65;margin-top:auto;padding-top:4px}

/* ---- ヒーロー ---- */
.hero{margin-bottom:8px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);margin:0 0 9px}
.hero h1{font-size:clamp(27px,3.2vw,40px);line-height:1.26;margin:0 0 12px;
  font-weight:800;letter-spacing:-.025em;max-width:20ch}
.hero h1 em{font-style:normal;color:var(--c,var(--bad))}
.hero p{color:var(--muted);font-size:13.5px;margin:0;max-width:66ch}

section{padding-top:48px}
.shead{display:flex;align-items:baseline;gap:11px;margin-bottom:5px;flex-wrap:wrap}
.shead h2{font-size:19px;font-weight:750;margin:0;letter-spacing:-.015em}
.shead .n{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.1em}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 18px;max-width:76ch}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh1)}
.pad{padding:20px 22px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:14px}
.tile{padding:18px 20px}
.tile .k{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;
  align-items:center;justify-content:space-between;gap:8px}
.tile .v{font-size:30px;font-weight:800;line-height:1.22;margin-top:7px}
.tile .v small{font-size:13px;font-weight:600;color:var(--faint);margin-left:4px}
.tile .n{font-size:12.5px;color:var(--muted);margin-top:2px}
.track{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:14px 0 9px}
.track i{display:block;height:100%;border-radius:99px;background:var(--c);
  transition:width .5s cubic-bezier(.2,.7,.3,1)}
.tile .r{font-size:12.5px;font-weight:700;color:var(--c)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:800;
  border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:var(--okline)}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:var(--badline)}
.pill.flat{background:var(--line2);color:var(--muted);border-color:var(--line)}

.note{border-radius:var(--r);padding:16px 19px;margin-top:16px;font-size:13.5px;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  box-shadow:var(--sh1)}
.note.bad{border-left-color:var(--bad)} .note.warn{border-left-color:var(--warn)}
.note.ok{border-left-color:var(--ok)}

.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:99px;padding:6px 14px;font-size:12.5px;cursor:pointer;
  font-family:inherit;font-weight:700;transition:.15s}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#191411}}
.srch{margin-left:auto;display:flex;gap:8px;align-items:center}
.srch input,.srch select{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);outline:none}
.srch input{width:168px}
.srch input:focus,.srch select:focus{border-color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:14px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  box-shadow:var(--sh1);transition:.18s}
.p:hover{box-shadow:var(--sh2);border-color:var(--faint);transform:translateY(-2px)}
.p .hd{display:flex;gap:10px;align-items:flex-start}
.av{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:grid;place-items:center;
  font-size:14px;font-weight:800;background:var(--sunk);color:var(--brand)}
.p h3{font-size:14px;margin:0;font-weight:750;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .sub{color:var(--faint);font-size:11px;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .land{font-size:23px;font-weight:800;line-height:1.25;margin-top:12px}
.p .land small{font-size:11.5px;font-weight:600;color:var(--faint)}
.p .nums{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.p .stats{display:flex;gap:14px;font-size:11px;color:var(--muted);
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.p .stats b{color:var(--fg2);font-weight:750}
.links{display:flex;gap:6px;margin-top:10px}
.links a{font-size:11px;text-decoration:none;border:1px solid var(--line);
  color:var(--muted);border-radius:8px;padding:4px 10px;font-weight:700;transition:.15s}
.links a:hover{border-color:var(--accent);color:var(--accent);background:var(--line2)}
.empty{color:var(--faint);font-size:13.5px;padding:30px 0;text-align:center;grid-column:1/-1}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.03em;
  border-bottom-color:var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line2)}
.scrollx{overflow-x:auto}
svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:12px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--muted);padding:10px 0;font-weight:700;font-size:13px;
  list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--faint)}
details[open] summary:before{content:"▾ "}
details li{margin:8px 0;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:11px 17px;text-decoration:none;
  font-size:13.5px;color:var(--fg);font-weight:700;box-shadow:var(--sh1);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#gate{max-width:520px;margin:22vh auto;padding:0 20px;text-align:center;color:var(--muted)}
#gate b{color:var(--fg);display:block;font-size:17px;margin-bottom:10px}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--faint);font-size:12px}
@media(max-width:1060px){
  .shell{grid-template-columns:1fr;gap:0;padding:0 18px}
  .side{position:static;max-height:none;overflow:visible;padding:20px 0 4px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
  .nav{flex-direction:row;overflow-x:auto;grid-column:1/-1;gap:2px}
  .nav a b{display:none}
  .sfoot{margin-top:0;grid-column:1/-1}
  main{padding-top:14px}
}
@media(max-width:620px){
  .srch{margin-left:0;width:100%}
  .srch input{flex:1;width:auto}
}
</style>
</head>
<body>
<div id="gate" hidden><b>この画面は鍵がないと開けません</b>
URLの「#」より後ろまで含めて開いてください。途中で切れていると中身は出ません。</div>
<div id="app" hidden></div>
<script>
var N=function(x){return Math.round(x).toLocaleString('ja-JP')};
var N1=function(x){return (Math.round(x*10)/10).toLocaleString('ja-JP')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var cls=function(r){return r>=100?'ok':(r>=90?'warn':'bad')};
var D=null;
var SECS=[['now','01','今月'],['people','02','ライバー'],['cohort','03','先月比'],
          ['share','04','占有率'],['plan','05','計画']];

function tiles(){
  var rows=[['全体💎','total','💎'],['20万超💎','over20','💎'],['20万超の人数','count','人']];
  return '<div class="grid3">'+rows.map(function(r){
    var x=D.now[r[1]], c=cls(x.rate), u=r[2], cnt=(r[1]==='count');
    return '<div class="card tile" style="--c:var(--'+c+')">'+
      '<div class="k"><span>'+r[0]+'</span><span class="pill '+c+'">'+x.rate+'%</span></div>'+
      '<div class="v num">'+(cnt?N1(x.proj):N(x.proj))+'<small>'+u+'</small></div>'+
      '<div class="n num">必要 '+(cnt?N1(x.need):N(x.need))+u+'</div>'+
      '<div class="track"><i style="width:'+Math.min(x.rate,100)+'%"></i></div>'+
      '<div class="r num">'+(x.gap>0?'あと '+(cnt?N1(x.gap):N(x.gap))+u:'届いています')+'</div></div>';
  }).join('')+'</div>';
}

function person(p){
  var pct=Math.min(100,Math.round(p.land/200000*100));
  var c=p.isOver?'ok':(pct>=70?'warn':'bad');
  var tag=p.quit?'<span class="pill bad">退会</span>'
        :(p.isOver?'<span class="pill ok">20万超</span>'
        :'<span class="pill warn num">あと'+N(p.gap)+'</span>');
  var rt=p.ratio==null?'<span class="pill flat">先月なし</span>'
        :'<span class="pill '+cls(p.ratio)+'">先月比 '+p.ratio+'%</span>';
  var L=[];
  if(p.user) L.push('<a href="https://www.tiktok.com/@'+encodeURIComponent(p.user)+'" target="_blank" rel="noopener">TikTok</a>');
  if(p.bs)   L.push('<a href="'+esc(p.bs)+'" target="_blank" rel="noopener">Backstage</a>');
  if(p.liny) L.push('<a href="'+esc(p.liny)+'" target="_blank" rel="noopener">Liny</a>');
  var ini=(p.name||'?').replace(/[^\p{L}\p{N}]/gu,'').slice(0,1)||'·';
  return '<div class="p" id="p-'+esc(p.user||Math.random().toString(36).slice(2))+
    '" data-over="'+(p.isOver?1:0)+'" data-was="'+(p.wasOver?1:0)+
    '" data-down="'+((p.ratio!=null&&p.ratio<100)?1:0)+'" data-near="'+((!p.isOver&&pct>=60)?1:0)+
    '" data-name="'+esc((p.name+' '+(p.user||'')+' '+(p.mgr||'')).toLowerCase())+
    '" data-land="'+p.land+'" data-ratio="'+(p.ratio==null?-1:p.ratio)+'" data-gap="'+p.gap+'">'+
    '<div class="hd"><div class="av">'+esc(ini)+'</div><div style="min-width:0;flex:1">'+
      '<h3>'+esc(p.name)+'</h3><div class="sub">'+(p.user?'@'+esc(p.user)+' · ':'')+
      esc(p.mgr||'担当なし')+(p.rank?' · '+esc(p.rank):'')+'</div></div>'+tag+'</div>'+
    '<div class="land num">'+N(p.land)+'<small> 💎 着地見込み</small></div>'+
    '<div class="nums"><span class="num">今月 '+N(p.mtd)+' ／ 先月 '+N(p.prev)+'</span>'+rt+'</div>'+
    '<div class="track" style="--c:var(--'+c+')"><i style="width:'+pct+'%"></i></div>'+
    '<div class="stats"><span>配信 <b class="num">'+N1(p.hours)+'h</b> · <b class="num">'+p.ldays+'日</b></span>'+
      '<span>平均同接 <b class="num">'+N1(p.ccv)+'</b></span>'+
      (p.event?'<span style="margin-left:auto">'+esc(p.event)+'</span>':'')+'</div>'+
    '<div class="links">'+L.join('')+'</div></div>';
}

function stacked(series,aName,bName){
  var W=1000,H=268,PL=58,PR=14,PB=34,PT=26;
  var step=(W-PL-PR)/series.length, BW=Math.min(56,step-20);
  var raw=Math.max.apply(null,series.map(function(s){return s.a+s.b}));
  var pow=Math.pow(10,Math.floor(Math.log10(raw))), mx=Math.ceil(raw/pow*1.08)*pow;
  var y=function(v){return PT+(1-v/mx)*(H-PT-PB)}, s='';
  for(var t=0;t<=4;t++){ var v=mx*t/4, yy=y(v);
    s+='<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="var(--line)"/>'+
       '<text x="'+(PL-9)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--faint)">'+
       (v>=10000?Math.round(v/10000)+'万':N(v))+'</text>'; }
  series.forEach(function(d,i){
    var x=PL+step*i+(step-BW)/2, yb=y(d.b), ya=y(d.a+d.b);
    s+='<g><rect x="'+x+'" y="'+yb+'" width="'+BW+'" height="'+Math.max(0,y(0)-yb)+'" fill="var(--over)" rx="3"/>'+
       '<rect x="'+x+'" y="'+ya+'" width="'+BW+'" height="'+Math.max(0,yb-ya)+'" fill="var(--under)" rx="3"/>'+
       '<text x="'+(x+BW/2)+'" y="'+(ya-9)+'" text-anchor="middle" font-size="12" font-weight="750" fill="var(--fg)">'+esc(d.top)+'</text>'+
       '<text x="'+(x+BW/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+esc(d.label)+'</text>'+
       '<title>'+esc(d.label)+'  合計 '+N(d.a+d.b)+'\n'+esc(bName)+' '+N(d.b)+'\n'+esc(aName)+' '+N(d.a)+'</title></g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>'+
    '<div class="lg"><span><i style="background:var(--over)"></i>'+esc(bName)+'</span>'+
    '<span><i style="background:var(--under)"></i>'+esc(aName)+'</span></div>';
}

function bars(list){
  var W=1000,RH=26,PL=182,PR=66,H=list.length*RH+30;
  var mx=Math.max(120,Math.max.apply(null,list.map(function(d){return d.ratio})))*1.03;
  var sc=function(v){return (v/mx)*(W-PL-PR)}, x100=PL+sc(100);
  var s='<rect x="'+PL+'" y="0" width="'+sc(100)+'" height="'+(H-24)+'" fill="var(--line2)"/>'+
        '<line x1="'+x100+'" y1="0" x2="'+x100+'" y2="'+(H-24)+'" stroke="var(--faint)" stroke-dasharray="3 4"/>'+
        '<text x="'+x100+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--faint)">100%</text>';
  list.forEach(function(d,i){
    var y=i*RH+4, w=Math.max(sc(d.ratio),2);
    var col=d.ratio>=100?'var(--ok)':(d.ratio>=60?'var(--warn)':'var(--bad)');
    var nm=d.name.length>15?d.name.slice(0,15)+'…':d.name;
    s+='<g><text x="'+(PL-11)+'" y="'+(y+14)+'" text-anchor="end" font-size="12.5" fill="var(--fg2)">'+esc(nm)+'</text>'+
       '<rect x="'+PL+'" y="'+(y+3)+'" width="'+w+'" height="'+(RH-11)+'" fill="'+col+'" rx="3"/>'+
       '<text x="'+(PL+w+9)+'" y="'+(y+14)+'" font-size="11.5" font-weight="700" fill="var(--muted)">'+d.ratio+'%'+
       (d.note?' '+esc(d.note):'')+'</text>'+
       '<title>'+esc(d.name)+'\n先月 '+N(d.prev)+' → 着地見込み '+N(d.land)+'（'+d.ratio+'%）</title></g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}

function recon(){
  var R=D.recon; if(!R) return '';
  var row=function(x,me){return '<tr'+(me?' style="font-weight:750"':'')+'><td>'+esc(x.label)+'</td>'+
    '<td class="num">'+x.n+'人</td><td class="num">'+N(x.prev)+'</td><td class="num">'+N(x.land)+'</td>'+
    '<td><span class="pill '+cls(x.ratio)+'">'+x.ratio+'%</span></td></tr>'};
  var g=R.gone.map(function(p){return esc(p.name)+'（先月 '+N(p.prev)+' → 今月 '+N(p.mtd)+'で停止）'}).join('、');
  return '<details><summary>日次ボードと数字が違う理由</summary>'+
    '<div class="card scrollx"><table><thead><tr><th>出し方</th><th>人数</th>'+
    '<th>先月実績</th><th>着地見込み</th><th>前月比</th></tr></thead><tbody>'+
    row(R.all,true)+row(R.stay)+row(R.raw)+'</tbody></table></div>'+
    '<ul><li><b>どちらも計算は合っている。違うのは2点だけ。</b></li>'+
    '<li><b>①退会した人を数に入れるか。</b>このボードは入れる（先月のダイヤは実際に出たものなので、'+
      'いなくなったぶんは素直に穴として見せたい）。日次ボードは外す。'+(g?'今回ちょうど1人ぶんで、'+g+'。':'')+'</li>'+
    '<li><b>②月末まで伸ばすときに補正をかけるか。</b>このボードは過去の実測から'+D.factors.cohort+
      '倍かける。日次ボードは日割り×30のまま。'+
      (R.band?'補正の幅（'+D.factors.used.map(function(f){return f.cohort}).join('・')+
      '倍）をそのまま効かせると<b>'+R.band[0]+'% 〜 '+R.band[1]+'%</b>に入る＝この数字はかなり揺れる。':'')+'</li>'+
    '<li>日次ボードの「実績（11日分）」は、このボードの在籍'+R.stay.n+'人の今月MTD合計と1円まで一致する＝元データは同じ。</li>'+
    '</ul></details>';
}

/* 横のサイド */
function sidebar(){
  var P=D.pace, ov=D.now.over20;
  var link=function(p,right,c){
    var ini=(p.name||'?').replace(/[^\p{L}\p{N}]/gu,'').slice(0,1)||'·';
    return '<a href="#people" data-go="'+esc(p.user||'')+'" title="カードへ飛ぶ">'+
      '<span class="av" style="width:22px;height:22px;flex:0 0 22px;border-radius:7px;font-size:10px">'+esc(ini)+'</span>'+
      '<span class="nm">'+esc(p.name)+'</span>'+
      '<span class="pill '+c+'" style="font-size:10.5px;padding:1px 7px">'+right+'</span></a>'};
  var down=D.people.filter(function(p){return p.ratio!=null&&p.ratio<100})
            .sort(function(a,b){return a.ratio-b.ratio}).slice(0,4);
  var near=D.people.filter(function(p){return !p.isOver&&p.gap>0})
            .sort(function(a,b){return a.gap-b.gap}).slice(0,4);

  return '<div class="side">'+
    '<div class="logo">DeNA CREATOR LINKS<span>20万超KPI 逆算ボード</span></div>'+
    '<nav class="nav">'+SECS.map(function(s){
      return '<a href="#'+s[0]+'"><b>'+s[1]+'</b>'+s[2]+'</a>'}).join('')+'</nav>'+
    (P && P.perDay!=null ?
      '<div class="scard pace"><h4>残りのペース</h4>'+
      '<div class="big num" style="color:var(--'+(P.keepUp?'ok':'bad')+')">'+N(P.perDay)+
      '<small> 💎 / 日</small></div>'+
      '<div class="row"><span>いまのペース</span><b class="num">'+N(P.curPerDay)+' / 日</b></div>'+
      '<div class="row"><span>残り</span><b class="num">'+P.leftDays+'日 · '+N(P.needLeft)+'💎</b></div>'+
      '<div class="row" style="margin-top:7px;color:var(--'+(P.keepUp?'ok':'bad')+');font-weight:700">'+
        (P.keepUp?'このペースなら届く':'このペースだと届かない')+'</div></div>' : '')+
    '<div class="scard"><h4>落ち込みが大きい</h4><div class="mini">'+
      down.map(function(p){return link(p,p.ratio+'%',cls(p.ratio))}).join('')+'</div></div>'+
    '<div class="scard"><h4>20万まであと少し</h4><div class="mini">'+
      (near.length?near.map(function(p){return link(p,N(p.gap),'warn')}).join('')
       :'<span style="font-size:12px;color:var(--faint)">なし</span>')+'</div></div>'+
    '<a class="btn" href="'+esc(D.daily_board)+'" target="_blank" rel="noopener" '+
      'style="font-size:12.5px;padding:9px 13px">日次ボードを開く →</a>'+
    '<div class="sfoot">更新 '+esc(D.updated)+'<br>'+esc(D.asof)+'<br>'+
      'ハイタッチ確認シート '+esc(D.tab)+' タブ</div></div>';
}

function sec(id,n,title,lede,body){
  return '<section id="'+id+'"><div class="shead"><span class="n">'+n+'</span><h2>'+title+'</h2></div>'+
         (lede?'<p class="lede">'+lede+'</p>':'')+body+'</section>';
}

function start(data){
  D=data;
  var c=D.cohort_sum, L=D.ladder, last=L[L.length-1], h=D.history;
  var avg=Math.round(h.reduce(function(a,x){return a+x.share},0)/h.length*10)/10;
  var r3=h.slice(-3), ra=Math.round(r3.reduce(function(a,x){return a+x.share},0)/r3.length*10)/10;
  var ov=D.now.over20, pc=D.now.count, tt=D.now.total;
  var head=ov.rate>=100 ? ['20万超ダイヤは<em>必要な数に届いて</em>いる','ok']
                        : ['20万超ダイヤが<em>あと'+N(ov.gap)+'</em>足りない','bad'];

  var m='<div class="hero"><p class="eyebrow">'+esc(D.month)+' · '+esc(D.asof)+'</p>'+
    '<h1 style="--c:var(--'+head[1]+')">'+head[0]+'</h1>'+
    '<p>全体計画から逆算した必要ラインに対して、いまの着地見込みがどこにいるか。人数は<b>あと'+
    N1(pc.gap>0?pc.gap:0)+'人</b>。</p></div>';

  m+=sec('now','01','今月はどうなりそうか','着地の見込みと、全体計画から逆算した「必要な数」。',
    tiles()+'<div class="note'+(ov.rate<100?' bad':' ok')+'">'+
    (ov.rate>=100&&pc.rate<100
      ? '<b>ダイヤは届くが、人数が足りない。</b>一人あたりが大きい人で届いていて、層の厚みでは届いていない。'
      : (ov.rate>=100 ? '<b>ダイヤも人数も必要な数に届いている。</b>'
         : '<b>20万超が未達。</b>ダイヤが<b>あと'+N(ov.gap)+'💎</b>、人数が<b>あと'+N1(pc.gap)+
           '人</b>足りない。全体が'+tt.rate+'%なのは20万未満の層が伸びているからで、この層だけ見ると届いていない。'))+
    '</div>');

  var cnt=function(f){return D.people.filter(f).length};
  m+=sec('people','02','ライバー別','20万のまわりにいる'+D.people.length+'人。バーは20万ダイヤまでの距離。',
    '<div class="tools"><div class="chips">'+
      '<button class="chip" data-f="all" aria-pressed="true">全員 '+D.people.length+'</button>'+
      '<button class="chip" data-f="over" aria-pressed="false">20万超えそう '+cnt(function(p){return p.isOver})+'</button>'+
      '<button class="chip" data-f="down" aria-pressed="false">先月より落ちている '+cnt(function(p){return p.ratio!=null&&p.ratio<100})+'</button>'+
      '<button class="chip" data-f="near" aria-pressed="false">あと一歩 '+cnt(function(p){return !p.isOver&&p.land/200000>=0.6})+'</button>'+
    '</div><div class="srch">'+
      '<input id="q" type="search" placeholder="名前・担当で絞る" autocomplete="off">'+
      '<select id="sort"><option value="land">着地が多い順</option>'+
        '<option value="ratio">先月比が低い順</option><option value="gap">20万まであと少ない順</option></select>'+
    '</div></div><div class="people" id="people-list">'+D.people.map(person).join('')+
    '<p class="empty" id="empty" hidden>あてはまる人がいません</p></div>');

  m+=sec('cohort','03','先月20万を超えた'+c.n+'人のいま',
    '着地見込み ÷ 先月の実績。グレーの帯より右が、先月を上回っている人。',
    '<div class="card pad">'+bars(D.cohort)+'</div>'+
    '<div class="note'+(c.ratio<100?' bad':' ok')+'"><b>この'+c.n+'人だけ追うと、今月は先月の'+c.ratio+'%</b>'+
    '（'+N(c.prev)+' → '+N(c.land)+'）。'+c.under100+'人が100%割れで、今月も20万を超えそうなのは'+c.keep+'人。'+
    (D.recon?'退会した人を除いて<b>在籍'+D.recon.stay.n+'人だけ</b>なら<b>'+D.recon.stay.ratio+'%</b>。':'')+
    (c.ratio<100?'新しく上がってくる人が乗っても20万超の合計は'+ov.rate+'%止まり＝<b>「出す」も「残す」も足りていない。</b>':'')+
    '</div>'+recon());

  var pk=h.reduce(function(a,x){return x.tanka>a.tanka?x:a},h[0]), lt=h[h.length-1];
  var sb='<div class="card pad">'+stacked(h.map(function(x){return {label:x.m,a:x.under20,b:x.over20,top:x.share+'%'}}),
      '20万未満💎','20万超💎')+'</div>'+
    '<div class="card scrollx" style="margin-top:14px"><table><thead><tr><th>月</th><th>全体💎</th>'+
    '<th>20万超💎</th><th>占有率</th><th>人数</th><th>一人あたり</th></tr></thead><tbody>'+
    h.map(function(x){return '<tr><td>'+esc(x.m)+'</td><td class="num">'+N(x.total)+'</td><td class="num">'+
      N(x.over20)+'</td><td class="num">'+x.share+'%</td><td class="num">'+x.n20+'人</td><td class="num">'+
      N(x.tanka)+'</td></tr>'}).join('')+'</tbody></table></div>';
  if(lt.tanka<pk.tanka)
    sb+='<div class="note warn">一人あたりは'+esc(pk.m)+'の'+N(pk.tanka)+'がいちばん高く、'+esc(lt.m)+'は'+
      N(lt.tanka)+'（−'+Math.round((1-lt.tanka/pk.tanka)*100)+'%）。<b>層は厚くなっているが、一人の大きさは小さくなっている。</b>'+
      'だから同じダイヤを出すのに必要な人数はこれから増える。</div>';
  m+=sec('share','04','全体のどれだけをこの層が作っているか',
    esc(h[0].m)+'〜'+esc(h[h.length-1].m)+'は'+Math.min.apply(null,h.map(function(x){return x.share}))+'% 〜 '+
    Math.max.apply(null,h.map(function(x){return x.share}))+'%、平均<b>'+avg+'%</b>。年の前半は'+h[0].share+
    '%で、直近3か月は'+r3.map(function(x){return x.share+'%'}).join('・')+'（平均<b>'+ra+
    '%</b>）＝<b>割合そのものが上がってきている</b>。', sb);

  var pb='<div class="card pad">'+stacked(L.map(function(x){return {label:x.m,a:x.under,b:x.need,top:N1(x.people)+'人'}}),
      '20万未満の見込み💎','必要な20万超💎')+'</div>'+
    '<div class="card scrollx" style="margin-top:14px"><table><thead><tr><th>月</th><th>全体計画💎</th>'+
    '<th>20万未満の見込み💎</th><th>必要な20万超💎</th><th>必要な占有率</th><th>必要な人数</th></tr></thead><tbody>'+
    L.map(function(x){return '<tr'+(x.m===D.month?' style="font-weight:750"':'')+'><td>'+esc(x.m)+
      '</td><td class="num">'+N(x.plan)+'</td><td class="num">'+N(x.under)+'</td><td class="num">'+N(x.need)+
      '</td><td class="num">'+x.share+'%</td><td class="num">'+N1(x.people)+'人</td></tr>'}).join('')+
    '</tbody></table></div>'+
    '<div class="note"><b>必要な占有率はどの月も7割前後</b>で、直近3か月の実績（'+ra+'%）の範囲内＝比率は無理をしなくていい。'+
    'きついのは人数で、<b>'+N1(L[0].people)+'人 → '+esc(last.m)+'に'+N1(last.people)+'人</b>。'+
    '単価'+N(D.tanka)+'で割った目安なので、単価が下がればさらに増える。</div>';
  m+=sec('plan','05','毎月いくら出せばいいか',
    '全体計画から「20万未満の層が出すぶん」を引いた残り。20万未満は直近3か月で月およそ +'+N(D.under_delta)+
    '💎 伸びているので、そのペースが続く前提。', pb);

  m+='<details><summary>数え方と注意点</summary><ul>'+
     '<li>確定値は「先月のダイヤモンド数」の列だけを使う。「ダイヤモンド」の列は月の途中の値なので確定値には使わない</li>'+
     '<li>シートは2日遅れ。'+esc(D.tab)+'のタブに入っているのは'+esc(D.asof)+'</li>'+
     '<li>着地見込みは'+D.days+'日ぶんを月末まで伸ばしたもの。倍率は過去の「同じ日づけ」で実測した値の平均（全体 '+
       D.factors.total+'倍・20万超💎 '+D.factors.over20+'倍・人数 '+D.factors.n20+'倍）</li>'+
     '<li><b>先月比だけは別の倍率（'+D.factors.cohort+'倍）。</b>全体の倍率は「新しく上がってきた人」込みなので、'+
       '決まった束にそのまま掛けると大きく出る。過去の月で同じ束の伸び方を測り直した値（'+
       D.factors.used.map(function(f){return esc(f.m)+' '+f.cohort}).join(' / ')+'）を使っている</li>'+
     '<li>「残りのペース」は、20万超えそうな人の今月の実績を残り日数で割ったもの。月末の追い込みぶんは入っていない'+
       '（だから見込みより厳しく出る）</li>'+
     '<li>名寄せはクリエイターID。<b>退会のマークは「クリエイターID」列に入りライバー名が空になる</b>ので、'+
       'IDが数字でない行はユーザー名で拾う（IDをキーにすると退会者が全員1人に潰れる）</li>'+
     '<li>退会・リスト落ちの人の数字はそこで止まるので、月末まで伸ばさない</li>'+
     '<li>全体計画の正本は「00.事業戦略 / 計画」。そちらが動いたら monthly_kpi.py の PLAN を直す</li>'+
     '</ul></details>'+
     '<p class="foot">このページは暗号化してあります。URLの「#」以降が鍵なので、渡すときは最後まで含めてください。社外には出さないこと。</p>';

  var app=document.getElementById('app');
  app.innerHTML='<div class="shell">'+sidebar()+'<main>'+m+'</main></div>';
  app.hidden=false;

  var list=document.getElementById('people-list'), empty=document.getElementById('empty');
  var q=document.getElementById('q'), sort=document.getElementById('sort'), filt='all';
  function apply(){
    var t=(q.value||'').trim().toLowerCase(), n=0;
    [].forEach.call(list.querySelectorAll('.p'),function(el){
      var ok=(filt==='all'||el.getAttribute('data-'+filt)==='1') &&
             (!t||el.getAttribute('data-name').indexOf(t)>=0);
      el.style.display=ok?'':'none'; if(ok)n++;
    });
    empty.hidden=n>0;
  }
  function order(){
    var k=sort.value, els=[].slice.call(list.querySelectorAll('.p'));
    els.sort(function(a,b){
      var x=+a.getAttribute('data-'+k), y=+b.getAttribute('data-'+k);
      if(k==='land') return y-x;
      if(k==='ratio'){ if(x<0)return 1; if(y<0)return -1; return x-y; }
      if(x===0&&y===0) return (+b.getAttribute('data-land'))-(+a.getAttribute('data-land'));
      if(x===0) return 1;
      if(y===0) return -1;
      return x-y;
    });
    els.forEach(function(e){list.insertBefore(e,empty)});
  }
  /* ★ URLの「#」以降は復号の鍵。リンクで書き換わると鍵が消えて開けなくなるので、
        ページ内移動は既定動作を止めて自前でスクロールする */
  app.addEventListener('click',function(e){
    var nav=e.target.closest('.nav a');
    if(nav){ e.preventDefault();
      var t=document.getElementById(nav.getAttribute('href').slice(1));
      if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
      return; }
    var b=e.target.closest('.chip');
    if(b){ filt=b.getAttribute('data-f');
      app.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
      apply(); return; }
    var g=e.target.closest('[data-go]');
    if(g){ e.preventDefault();
      var el=document.getElementById('p-'+g.getAttribute('data-go'));
      if(el){ filt='all'; q.value='';
        app.querySelectorAll('.chip').forEach(function(x){
          x.setAttribute('aria-pressed',x.getAttribute('data-f')==='all'?'true':'false')});
        apply();
        el.scrollIntoView({behavior:'smooth',block:'center'});
        el.style.outline='2px solid var(--accent)'; el.style.outlineOffset='3px';
        setTimeout(function(){el.style.outline=''},1600);
      }
    }
  });
  q.addEventListener('input',apply);
  sort.addEventListener('change',function(){order();apply()});

  var links={}; app.querySelectorAll('.nav a').forEach(function(a){links[a.getAttribute('href').slice(1)]=a});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){ if(!en.isIntersecting)return;
        for(var k in links) links[k].classList.toggle('on',k===en.target.id); });
    },{rootMargin:'-10px 0px -74% 0px'});
    SECS.forEach(function(s){var el=document.getElementById(s[0]); if(el)io.observe(el)});
  }
}
