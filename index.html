<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TikTok LIVE 公式イベントカレンダー</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>TikTok LIVE 公式イベントカレンダー</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="controls" id="controls"></div>
  <div class="chart" id="chart" role="listbox" aria-label="イベントスケジュール"></div>
  <div id="detail"></div>

  <footer>
    <div>ご注意</div>
    <ul>
      <li>ダイヤの参加条件は万単位で表記しています。</li>
      <li>LIVE Ranking+ ハロウィンパーティーは内容が確定前のため、期間が変わる可能性があります。</li>
      <li>PK Battle Royal は参加条件が公開されていません。</li>
      <li>イベントの期間・条件は変更されることがあります。参加前に必ず公式のお知らせをご確認ください。</li>
    </ul>
  </footer>
</div>

<script src="data/events.js"></script>
<script src="data/events.internal.js" onerror="void 0"></script>
<script src="assets/app.js"></script>
</body>
</html>
