<title>宿題カード</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{
  --paper:#FBF8F5; --card:#FFFFFF; --ink:#1D1822; --muted:#736B78; --line:#ECE5DE;
  --chip:#F4EFEA; --good:#16A34A; --warn:#D9820A; --bad:#E0483C;
  --accent:#10B981; --accent-soft:#ECFDF5;
  --ring-track:#EDE7E1;
  --shadow:0 10px 30px -12px rgba(30,20,40,.22), 0 2px 8px -4px rgba(30,20,40,.12);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141118; --card:#201B28; --ink:#F4F0F5; --muted:#A79FAC; --line:#332C3E;
    --chip:#2A2436; --accent-soft:#182b23; --ring-track:#332C3E;
    --shadow:0 14px 34px -14px rgba(0,0,0,.6), 0 2px 8px -4px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#141118; --card:#201B28; --ink:#F4F0F5; --muted:#A79FAC; --line:#332C3E;
  --chip:#2A2436; --accent-soft:#182b23; --ring-track:#332C3E;
  --shadow:0 14px 34px -14px rgba(0,0,0,.6), 0 2px 8px -4px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;padding:22px 14px 40px;}
.wrap{max-width:460px;margin:0 auto;}
.pagehead{text-align:center;margin-bottom:16px}
.pagehead h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:26px;margin:0 0 4px;letter-spacing:.02em}
.pagehead p{margin:0;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);
  background:var(--chip);padding:4px 10px;border-radius:999px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* liver switcher */
.switch{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding:2px}
.switch button{flex:1 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:14px;padding:9px 6px 8px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.18s;min-width:82px}
.switch button .em{font-size:20px;line-height:1}
.switch button[aria-selected="true"]{color:#fff;border-color:transparent;background:var(--accent);box-shadow:var(--shadow)}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px 24px;box-shadow:var(--shadow);
  animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.chead .nm{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:22px;line-height:1.25;margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.stage{background:var(--accent);color:#fff}
.pill.rank{background:var(--accent-soft);color:var(--accent)}

/* goal */
.goal{display:flex;align-items:center;gap:18px;padding:16px;border-radius:20px;background:var(--accent-soft);margin-bottom:16px}
.ring{position:relative;flex:0 0 auto;width:120px;height:120px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:"Outfit",sans-serif;font-weight:800;font-size:30px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.ring .pct span{font-size:10px;color:var(--muted);margin-top:2px}
.goalinfo .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.goalinfo .big{font-family:"Outfit","Zen Maru Gothic",sans-serif;font-weight:800;font-size:24px;margin:1px 0 2px}
.goalinfo .now{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.goalinfo .far{font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}

/* weak badge */
.weak{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;
  background:var(--card);border:1.5px solid var(--accent);margin-bottom:16px}
.weak .ic{font-size:20px;line-height:1.2}
.weak b{font-family:"Zen Maru Gothic",sans-serif;color:var(--accent);font-size:15px}
.weak p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:20px}
.metrics .m{background:var(--chip);border-radius:13px;padding:9px 6px;text-align:center}
.metrics .m .v{font-family:"Outfit",sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.metrics .m .k{font-size:10px;color:var(--muted);margin-top:1px}
.metrics .m.good .v{color:var(--good)} .metrics .m.warn .v{color:var(--warn)} .metrics .m.bad .v{color:var(--bad)}

/* task sections */
.sec{margin-bottom:18px}
.sec h3{font-family:"Zen Maru Gothic",sans-serif;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec.today{background:#FFF9ED;border:1.5px solid #F4C55A;border-radius:18px;padding:14px 15px 6px}
:root[data-theme="dark"] .sec.today{background:#2a2312;border-color:#6b551f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec.today{background:#2a2312;border-color:#6b551f}}
.sec.today h3{color:#B26A08}
:root[data-theme="dark"] .sec.today h3{color:#F4C55A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec.today h3{color:#F4C55A}}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tasks li{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);cursor:pointer;transition:.15s;font-size:13.5px}
.sec.today ul.tasks li{background:rgba(255,255,255,.55)}
:root[data-theme="dark"] .sec.today ul.tasks li{background:rgba(0,0,0,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec.today ul.tasks li{background:rgba(0,0,0,.18)}}
ul.tasks li .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2.5px solid var(--accent);
  display:grid;place-items:center;margin-top:1px;transition:.15s}
ul.tasks li .box svg{width:13px;height:13px;opacity:0;transition:.15s}
ul.tasks li.done{opacity:.55}
ul.tasks li.done .box{background:var(--accent)}
ul.tasks li.done .box svg{opacity:1}
ul.tasks li.done .txt{text-decoration:line-through}
ul.tasks li .star{color:var(--warn);font-weight:700;font-size:11px;background:#FFF3DA;padding:1px 7px;border-radius:999px;margin-left:2px;white-space:nowrap}
:root[data-theme="dark"] ul.tasks li .star{background:#4a3a12}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) ul.tasks li .star{background:#4a3a12}}
/* ギフギャラ: 進捗→コンプ→完了 を1つずつ表示 */
ul.tasks li.ggdone, ul.tasks li.ggbanner{display:none}
ul.gg-prog li.gg{display:none}
ul.gg-prog li.ggdone{display:flex}
ul.gg-cleared li.gg, ul.gg-cleared li.ggdone{display:none}
ul.gg-cleared li.ggbanner{display:flex;background:var(--accent-soft);border-color:var(--accent)}
li.ggbanner .box{background:var(--accent);border-color:var(--accent)}
li.ggbanner .box svg{opacity:1}
:root[data-theme="dark"] ul.tasks li .star{background:#4a3a12}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) ul.tasks li .star{background:#4a3a12}}
/* roadmap to 100万 */
.roadsec{margin:2px 0 20px}
.roadsec h3{font-family:"Zen Maru Gothic",sans-serif;font-size:15px;margin:0 0 4px}
.road{position:relative;padding:38px 10px 42px}
.rinner{position:relative}
.rtrack{position:relative;height:6px;border-radius:3px;background:var(--ring-track)}
.rfill{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--accent);width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.rnode{position:absolute;top:-6px;transform:translateX(-50%);text-align:center;width:56px}
.rnode .rd{width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--ring-track);margin:0 auto;transition:.4s}
.rnode.done .rd{background:var(--accent);border-color:var(--accent)}
.rnode.goal .rd{width:24px;height:24px;margin-top:-3px;border-color:var(--accent);display:grid;place-items:center;font-size:12px}
.rnode .rl{margin-top:8px;font-family:"Outfit",sans-serif;font-size:11px;font-weight:700;line-height:1.25}
.rnode .rl i{display:block;font-style:normal;font-size:8.5px;color:var(--muted);font-weight:600;font-family:"Zen Kaku Gothic New",sans-serif}
.rmark{position:absolute;top:-32px;transform:translateX(-50%);font-size:18px;transition:left 1.1s cubic-bezier(.4,0,.2,1);text-align:center;line-height:1;z-index:2}
.rmark span{display:block;font-size:8.5px;color:var(--accent);font-weight:800;margin-top:1px}
/* event */
.evsec{margin:2px 0 18px}
.evsec h3{font-family:"Zen Maru Gothic",sans-serif;font-size:15px;margin:0 0 10px}
.ev{border:1.5px solid var(--accent);border-radius:18px;padding:15px 16px;background:var(--accent-soft)}
.evtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.evname{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:19px;color:var(--accent)}
.evstage{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--card);padding:3px 9px;border-radius:999px;white-space:nowrap}
.evsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.evfit{font-size:12.5px;margin:11px 0 12px;padding:9px 11px;border-radius:11px;line-height:1.55}
.evfit.ok{background:var(--card);color:var(--ink)}
.evfit.weak{background:#FFF3DA;color:#8a5a08}
:root[data-theme="dark"] .evfit.weak{background:#3a2f12;color:#f0c67a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .evfit.weak{background:#3a2f12;color:#f0c67a}}
.evlink{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;color:#fff;background:var(--accent);
  text-decoration:none;padding:12px 16px;border-radius:12px}
.evlink:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.redflag{background:#FEF2F2;border:1.5px solid #FCA5A5;color:#B91C1C;font-size:12px;border-radius:12px;padding:9px 12px;margin:-8px 0 16px;line-height:1.5}
:root[data-theme="dark"] .redflag{background:#3a1a1a;color:#fca5a5;border-color:#7f1d1d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .redflag{background:#3a1a1a;color:#fca5a5;border-color:#7f1d1d}}
.donebar{text-align:center;font-size:12.5px;color:var(--muted);margin-top:6px}
.donebar b{color:var(--accent);font-size:15px;font-family:"Outfit",sans-serif}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.7}
.foot .msg{font-family:"Zen Maru Gothic",sans-serif;color:var(--accent);font-size:14px}
.note{max-width:460px;margin:16px auto 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.7;opacity:.9}
.srcnote{max-width:460px;margin:6px auto 0;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.6;opacity:.75}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

      ["投げる“大義名分”（次イベントの目標・夢）を毎回提示",0],
      ["低額ギフトを投げやすい文化をつくる（すぐ拾って褒める）",0]],
  },
};
const DAY=Math.floor(Date.now()/864e5); // 日替わりローテーション種
function fillT(s,dh,H){return s.replace(/\{dh\}/g,dh).replace(/\{H\}/g,H);}
function stageOK(it,S0){return it.length<3?true:(it[2]==='s0'?S0:(it[2]==='s1'?!S0:true));}
// 在庫からn件を日替わりで回す（開始位置を毎日n進める＝連チャン回避／offで人ごとに変える）
function rotp(pool,n,S0,off,dh,H){
  const a=(pool||[]).filter(function(it){return stageOK(it,S0);});
  if(a.length<=n) return a.map(function(it){return [fillT(it[0],dh,H),it[1]];});
  const start=(((DAY*n+off)%a.length)+a.length)%a.length;
  const out=[]; for(let i=0;i<n;i++){const it=a[(start+i)%a.length]; out.push([fillT(it[0],dh,H),it[1]]);}
  return out;
}
// ★弱点＝動的ボトルネック判定（固定順やめ／割れ幅・時給効率・バトル0・赤信号を考慮）
function buildPlan(d){
  const S0=(d.stage==='S0');
  const ht=S0?60:80, ft=S0?100:(d.stage==='S1'?200:300), yt=S0?1500:(d.stage==='S1'?3000:5000);
  const gBase=Math.max(0,1-d.h/ht), gReach=Math.max(0,1-d.fans/ft), gKanki=Math.max(0,1-(d.now/d.h)/yt);
  const battleZero=(!S0 && d.bat===0);
  let lane,weak,why;
  if(battleZero){lane='kanki';weak='換金の導線づくり';why='露出はあるのにバトル未着手＝換金の主戦場に乗れてない。まず乗ろう。';}
  else if(gBase>0.5){lane='base';weak='土台（配信量）';why='まず“出る量”が最優先。ここが全ての土台。';}
  else{const m=Math.max(gBase,gReach,gKanki);
    if(m===gKanki){lane='kanki';weak='換金（1配信の単価）';why='配信量はある。1配信で稼ぐ“単価”を上げよう。';}
    else if(m===gReach){lane='reach';weak='集客の固定化';why='露出を“ファン”に変えるのが伸びしろ。';}
    else{lane='base';weak='土台（配信量）';why='まず“出る量”を安定させよう。';}}
  let red='';
  if(d.bat>70 && d.now<(S0?50000:200000) && /維持せず/.test(d.rank)) red='⚠️ バトル比率は高いけど、素の配信・固定客が薄いサイン。バトル一発頼みになってないか要注意。';
  const dh=S0?'3時間':'4時間', H=S0?'1日3時間':'1日4時間＝週20h';
  const off=(Math.floor(d.now/777)+(d.fans||0))|0; // 人ごとにローテをずらす
  const P=POOL[lane];
  const anchT=lane==='kanki'?(S0?P.anchorTodayS0:P.anchorTodayS1):P.anchorToday;
  const todayPool=lane==='kanki'?(S0?P.todayS0:P.todayS1):P.today;
  const today=[[fillT(anchT,dh,H),1]].concat(rotp(todayPool,3,S0,off,dh,H));
  let week=[[fillT(P.anchorWeek,dh,H),1]].concat(rotp(P.week,4,S0,off+5,dh,H));
  week.splice(2,0,["__GG__",0]);
  return {weak,why,red,week,today};
}
function taskLi(t,s){return `<li onclick="sendCheck(this)"><span class="box">${F}</span><span class="txt">${t}</span>${s?'<span class="star">重点</span>':''}</li>`;}
function ggBlock(star){return `<li class="gg" onclick="ggProgress(this)"><span class="box">${F}</span><span class="txt">ギフギャラの進捗をスタッフに送る</span>${star?'<span class="star">重点</span>':''}</li>`
+`<li class="ggdone" onclick="ggComplete(this)"><span class="box">${F}</span><span class="txt">コンプしたらスクショをスタッフに送る</span></li>`
+`<li class="ggbanner" onclick="ggRevert(this)"><span class="box">${F}</span><span class="txt">✅ ギフギャラ完了・報告済み（タップで戻す）</span></li>`;}
function ggProgress(li){li.closest('ul').classList.add('gg-prog');}   // 進捗送信→コンプ表示に切替
function ggComplete(li){li.closest('ul').classList.add('gg-cleared');} // コンプ送信→全部消して完了バナー
function ggRevert(el){el.closest('ul').classList.remove('gg-prog','gg-cleared');}
function tasks(arr){return '<ul class="tasks">'+arr.map(([t,s])=>t==="__GG__"?ggBlock(s):taskLi(t,s)).join('')+'</ul>';}
function render(key){
  const d=L[key],ng=nextGoal(d.now),p=Math.min(100,Math.round(d.now/ng.v*100)),off=C*(1-p/100),proj=landing(d.now),ev=eventPlan(d.now,proj),far=((1000000-d.now)/10000).toFixed(1),plan=buildPlan(d);
  document.querySelectorAll('#switch button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===key));
  const el=document.getElementById('card');
  el.style.setProperty('--accent',d.ac); el.style.setProperty('--accent-soft',d.acs);
  el.innerHTML=`
  <div class="card" style="--accent:${d.ac};--accent-soft:${d.acs}">
    <div class="chead">
      <div><h2 class="nm">${d.nm}</h2>
        <div class="pills"><span class="pill stage">${d.stage}</span><span class="pill rank">${d.rank}</span></div></div>
      <div style="font-size:34px">${d.em}</div>
    </div>
    <div class="goal">
      <div class="ring"><svg width="120" height="120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--ring-track)" stroke-width="11"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="${d.ac}" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" id="prog"/></svg>
        <div class="pct"><b>${p}%</b><span>達成</span></div></div>
      <div class="goalinfo">
        <div class="lbl">次のゴール</div>
        <div class="big">${ng.l} ${ng.s}</div>
        <div class="now">いま ${jp(d.now)}💎　/　📈 着地見込み ${jp(proj)}💎</div>
        <div class="far">🏆 A帯(100万💎)まで あと${far}万</div>
      </div>
    </div>
    <div class="weak"><span class="ic">🎯</span><div><b>今週の重点：${plan.weak}</b><p>${plan.why}</p></div></div>
    ${plan.red?`<div class="redflag">${plan.red}</div>`:''}
    <div class="metrics">${d.met.map(([v,k,s])=>`<div class="m ${s}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>
    <div class="sec"><h3>📝 今週のクエスト</h3>${tasks(plan.week)}</div>
    <div class="sec today"><h3>🔥 今日 これだけは！（「重点」は必須）</h3>${tasks(plan.today)}</div>
    <div class="evsec"><h3>🎪 次のあなたにぴったりのイベント</h3>
      <div class="ev">
        <div class="evtop"><span class="evname">${ev.names.join(" or ")}</span><span class="evstage">着地見込み ${jp(proj)}💎</span></div>
        <div class="evsub">${ev.sub}</div>
        ${ev.ok?'<p class="evfit ok">✅ 着地見込みが現実的！このイベントに火力を集中しよう。</p>':'<p class="evfit weak">🗓 開催時期は担当に確認しよう（月末の<b>事務所イベント</b>も要チェック）。</p>'}
        <a class="evlink" href="https://dcl-event.github.io/dcl-tiktok-event-calendar/" target="_blank" rel="noopener">📅 開催時期をイベントカレンダーで確認 →</a>
      </div>
    </div>
    <div class="donebar">🔥 クリアした宿題 <b id="dc">0</b> 個 ／ 昨日より一歩！</div>
    <div class="foot"><div class="msg">${d.msg||'今日も一歩ずつ！🔥'}</div>
      最終更新 8/29 ・ 自動更新　/　担当と一緒に</div>
  </div>`;
  requestAnimationFrame(()=>{const c=document.getElementById('prog');if(c){c.style.transition='stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)';c.style.strokeDashoffset=off;}});
  el.addEventListener('click',()=>{const dc=document.getElementById('dc');if(dc)dc.textContent=el.querySelectorAll('li.done').length;});
}
const sw=document.getElementById('switch');
order.forEach(k=>{const b=document.createElement('button');b.dataset.k=k;b.setAttribute('role','tab');
  b.innerHTML=`<span class="em">${L[k].em}</span>${L[k].nm.split('（')[0].replace(/🍀|🥒/,'').slice(0,5)}`;
  b.onclick=()=>render(k);sw.appendChild(b);});
if(order.length<=1){var _s=document.getElementById('switch');if(_s)_s.style.display='none';}
render(order[0]);
</script>
